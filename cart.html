<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Корзина — Beige Box</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Forum&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=1">
</head>
<body data-page="cart">
<div id="site-header"></div>

<main>
  <div class="wrap page-head">
    <div class="crumbs"><a href="index.html">Главная</a> / Корзина</div>
    <h1>Корзина</h1>
    <p class="sub" id="sub"></p>
  </div>
  <div class="wrap cart-grid" id="cart"></div>
</main>

<div id="site-footer"></div>
<script src="js/products.js?v=1"></script>
<script src="js/main.js?v=1"></script>
<script>
function paintCart() {
  const c = cartRead();
  const box = document.getElementById('cart'), sub = document.getElementById('sub');
  if (!c.length) {
    sub.textContent = '';
    box.innerHTML = `<div class="empty"><h3>В&nbsp;корзине пока пусто</h3><p>Загляните в&nbsp;каталог: там можно подобрать подарок по&nbsp;получателю, поводу и&nbsp;бюджету.</p><a class="btn" href="catalog.html">Перейти в&nbsp;каталог</a></div>`;
    return;
  }
  const n = cartCount(), sum = cartSum(), total = sum;
  sub.textContent = `${n} ${plural(n, 'товар', 'товара', 'товаров')} на ${RUB(sum)}`;
  box.innerHTML = `<div>${c.map((i, k) => { const p = byId(i.id); return `
    <div class="li">
      <a href="product.html?id=${p.id}"><img src="${p.photos[0]}" alt="${p.name}"></a>
      <div><h3><a href="product.html?id=${p.id}">${nb(p.name)}</a></h3>
        ${i.size ? `<small>Размер: ${i.size}</small>` : ''}
        ${i.note ? `<small>Открытка: «${i.note.replace(/</g, '&lt;')}»</small>` : ''}
        <small>${RUB(p.price)} за&nbsp;шт.</small></div>
      <div class="li-right">
        <b>${RUB(p.price * i.qty)}</b>
        <div class="qty sm"><button type="button" onclick="chg(${k},-1)" aria-label="Меньше">−</button><span>${i.qty}</span><button type="button" onclick="chg(${k},1)" aria-label="Больше">+</button></div>
        <button class="rm" type="button" onclick="chg(${k},-999)">Удалить</button>
      </div>
    </div>`; }).join('')}
    <a class="btn line" href="catalog.html" style="margin-top:10px">${ICON.back}Продолжить покупки</a>
  </div>
  <aside class="summary">
    <h3>Ваш заказ</h3>
    <div class="r"><span>Товары, ${n}&nbsp;шт.</span><span>${RUB(sum)}</span></div>
    <div class="r"><span>Доставка</span><span>${total >= FREE_FROM ? 'бесплатно' : 'по тарифу'}</span></div>
    <div class="r t"><span>Итого</span><span>${RUB(total)}</span></div>
    <a class="btn wide" href="checkout.html">Оформить заказ ${ICON.arr}</a>
    <p class="hint">Упаковка и&nbsp;открытка уже в&nbsp;цене набора. Соберём за&nbsp;<span class="nw">2–3</span>&nbsp;рабочих дня.</p>
  </aside>`;
}
function chg(k, d) {
  const c = cartRead();
  c[k].qty = Math.min(20, c[k].qty + d);
  if (c[k].qty <= 0) c.splice(k, 1);
  cartWrite(c); paintCart();
}
document.addEventListener('DOMContentLoaded', paintCart);
</script>
</body>
</html>
