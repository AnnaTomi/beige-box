<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Заказ оформлен — Beige Box</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Forum&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=1">
</head>
<body data-page="success">
<div id="site-header"></div>

<main>
  <section style="padding-top:72px">
    <div class="wrap done">
      <div class="ok" id="ok"></div>
      <h1 id="h">Спасибо, заказ оформлен</h1>
      <p class="sub">Демо: в&nbsp;настоящем магазине здесь будет номер заказа, а&nbsp;на&nbsp;почту придёт чек.</p>
      <div class="steps" id="steps"></div>
      <p class="sub">Есть вопрос по&nbsp;заказу? Напишите, где вам удобнее:</p>
      <div id="m"></div>
      <a href="catalog.html" class="btn line" style="margin-top:34px">Вернуться в&nbsp;каталог</a>
    </div>
  </section>
</main>

<div id="site-footer"></div>
<script src="js/products.js?v=1"></script>
<script src="js/main.js?v=1"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  let last = null; try { last = JSON.parse(sessionStorage.getItem('bb_last')); } catch (e) {}
  const where = last ? ({ cdek: 'В пункте СДЭК или курьером', ya: 'Яндекс Доставкой' }[last.ship] || 'В пункте выдачи') : 'В пункте выдачи';
  const S = [['mail', 'Чек на почте', 'Сразу после оплаты'], ['box', 'Сборка', '2–3 рабочих дня'], ['truck', 'Отправка', 'Пришлём трек‑номер'], ['pin', 'Получение', where]];
  document.getElementById('ok').innerHTML = ICON.check;
  document.getElementById('steps').innerHTML = S.map(([i, b, s]) => `<div class="step"><span class="pi">${ICON[i]}</span><b>${b}</b><span>${nb(s)}</span></div>`).join(`<div class="to">${ICON.arr}</div>`);
  document.getElementById('m').innerHTML = MSG;
  if (last && last.name) document.getElementById('h').textContent = last.name + ', спасибо, заказ оформлен';
});
</script>
</body>
</html>
